<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal/Shell icon -->
  <rect x="4" y="12" width="56" height="40" rx="4" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <rect x="8" y="16" width="48" height="32" fill="#0f172a"/>

  <!-- Terminal prompt -->
  <circle cx="12" cy="22" r="2" fill="#ef4444"/>
  <circle cx="20" cy="22" r="2" fill="#f59e0b"/>
  <circle cx="28" cy="22" r="2" fill="#10b981"/>

  <!-- Command line -->
  <rect x="12" y="30" width="3" height="2" fill="#06b6d4"/>
  <rect x="18" y="30" width="16" height="2" fill="#64748b"/>

  <rect x="12" y="36" width="3" height="2" fill="#06b6d4"/>
  <rect x="18" y="36" width="24" height="2" fill="#64748b"/>

  <rect x="12" y="42" width="3" height="2" fill="#06b6d4"/>
  <rect x="18" y="42" width="2" height="2" fill="#10b981" opacity="0.8"/>

  <!-- MCP connection indicators -->
  <circle cx="48" cy="8" r="3" fill="#2563eb"/>
  <circle cx="56" cy="8" r="3" fill="#06b6d4"/>
  <line x1="48" y1="11" x2="48" y2="15" stroke="#2563eb" stroke-width="2"/>
  <line x1="56" y1="11" x2="56" y2="15" stroke="#06b6d4" stroke-width="2"/>
</svg>