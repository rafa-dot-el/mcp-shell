<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background pattern -->
  <rect width="1200" height="600" fill="url(#grad1)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Floating elements -->
  <circle cx="100" cy="100" r="3" fill="#2563eb" opacity="0.3"/>
  <circle cx="300" cy="150" r="2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="500" cy="80" r="4" fill="#1e40af" opacity="0.2"/>
  <circle cx="700" cy="120" r="2.5" fill="#2563eb" opacity="0.3"/>
  <circle cx="900" cy="90" r="3" fill="#06b6d4" opacity="0.25"/>
  <circle cx="1100" cy="130" r="2" fill="#1e40af" opacity="0.3"/>

  <circle cx="150" cy="450" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="350" cy="500" r="3" fill="#2563eb" opacity="0.2"/>
  <circle cx="550" cy="480" r="2.5" fill="#1e40af" opacity="0.3"/>
  <circle cx="750" cy="520" r="2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="950" cy="470" r="3" fill="#2563eb" opacity="0.25"/>
  <circle cx="1050" cy="510" r="2" fill="#1e40af" opacity="0.3"/>

  <!-- Terminal windows -->
  <rect x="50" y="200" width="120" height="80" rx="8" fill="#1e293b" opacity="0.1"/>
  <rect x="200" y="250" width="100" height="70" rx="6" fill="#0f172a" opacity="0.1"/>
  <rect x="350" y="300" width="110" height="75" rx="7" fill="#1e293b" opacity="0.1"/>

  <rect x="850" y="200" width="120" height="80" rx="8" fill="#1e293b" opacity="0.1"/>
  <rect x="950" y="280" width="100" height="70" rx="6" fill="#0f172a" opacity="0.1"/>
  <rect x="750" y="320" width="110" height="75" rx="7" fill="#1e293b" opacity="0.1"/>
</svg>