name: PR Feedback

on:
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened, ready_for_review ]

env:
  GO_VERSION: '1.23'

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: read
  actions: read

jobs:
  # Security check for fork detection
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.check.outputs.is-fork }}
      can-access-secrets: ${{ steps.check.outputs.can-access-secrets }}
    steps:
      - name: Check repository ownership
        id: check
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is-fork=true" >> $GITHUB_OUTPUT
            echo "can-access-secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Fork detected - some security scans will be limited"
          else
            echo "is-fork=false" >> $GITHUB_OUTPUT
            echo "can-access-secrets=true" >> $GITHUB_OUTPUT
          fi

  # Comprehensive testing and analysis
  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    needs: security-check
    outputs:
      test-results: ${{ steps.test-summary.outputs.results }}
      coverage-current: ${{ steps.coverage.outputs.current }}
      coverage-base: ${{ steps.coverage.outputs.base }}
      coverage-diff: ${{ steps.coverage.outputs.diff }}
      security-issues: ${{ steps.security.outputs.issues }}
      lint-issues: ${{ steps.lint.outputs.issues }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: '${{ runner.os }}-go-${{ hashFiles(''**/go.sum'') }}'
          restore-keys: |
            '${{ runner.os }}-go-'

      - name: Download dependencies
        run: go mod download

      # Run comprehensive tests
      - name: Install test tools
        run: |
          go install gotest.tools/gotestsum@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run unit tests with coverage
        run: |
          gotestsum --junitfile=tests.xml --format=testname -- -v -race -coverprofile=coverage-pr.out -covermode=atomic ./...

      - name: Run integration tests
        continue-on-error: true
        run: |
          go test -v -tags=integration ./... 2>&1 | tee integration-results.txt

      - name: Run e2e tests
        continue-on-error: true
        run: |
          go test -v -tags=e2e ./... 2>&1 | tee e2e-results.txt

      # Get baseline coverage from target branch
      - name: Get baseline coverage
        run: |
          # Checkout target branch to get baseline coverage
          git checkout ${{ github.event.pull_request.base.ref }}
          go test -coverprofile=coverage-base.out -covermode=atomic ./... || echo "0" > coverage-base.out
          git checkout ${{ github.event.pull_request.head.sha }}

      # Calculate coverage metrics
      - name: Calculate coverage metrics
        id: coverage
        run: |
          # Current coverage
          if [ -f coverage-pr.out ]; then
            CURRENT_COV=$(go tool cover -func=coverage-pr.out | grep total | awk '{print $3}' | sed 's/%//')
          else
            CURRENT_COV="0"
          fi

          # Base coverage
          if [ -f coverage-base.out ] && [ -s coverage-base.out ]; then
            BASE_COV=$(go tool cover -func=coverage-base.out | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
          else
            BASE_COV="0"
          fi

          # Calculate difference
          DIFF=$(echo "$CURRENT_COV - $BASE_COV" | bc -l 2>/dev/null || echo "0")

          echo "current=$CURRENT_COV" >> $GITHUB_OUTPUT
          echo "base=$BASE_COV" >> $GITHUB_OUTPUT
          echo "diff=$DIFF" >> $GITHUB_OUTPUT

          # Generate detailed coverage report
          if [ -f coverage-pr.out ]; then
            go tool cover -html=coverage-pr.out -o coverage-report.html
            go tool cover -func=coverage-pr.out > coverage-details.txt
          fi

      # Security analysis
      - name: Run security analysis
        id: security
        continue-on-error: true
        run: |
          # Run gosec
          gosec -fmt json -out gosec-report.json -severity medium ./... || true

          # Run govulncheck
          govulncheck -json ./... > govulncheck-report.json 2>&1 || true

          # Count issues
          GOSEC_ISSUES=$(jq '.Issues | length' gosec-report.json 2>/dev/null || echo "0")
          VULN_ISSUES=$(jq '[.finding] | length' govulncheck-report.json 2>/dev/null || echo "0")
          TOTAL_ISSUES=$((GOSEC_ISSUES + VULN_ISSUES))

          echo "issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT

      # Linting analysis
      - name: Run linting analysis
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --out-format=json --issues-exit-code=0 > lint-report.json

      - name: Process lint results
        run: |
          if [ -f lint-report.json ]; then
            LINT_ISSUES=$(jq '.Issues | length' lint-report.json 2>/dev/null || echo "0")
          else
            LINT_ISSUES="0"
          fi
          echo "issues=$LINT_ISSUES" >> $GITHUB_OUTPUT

      # Test summary
      - name: Generate test summary
        id: test-summary
        run: |
          # Parse test results
          if [ -f tests.xml ]; then
            TOTAL_TESTS=$(xmllint --xpath 'string(/testsuites/@tests)' tests.xml 2>/dev/null || echo "0")
            FAILED_TESTS=$(xmllint --xpath 'string(/testsuites/@failures)' tests.xml 2>/dev/null || echo "0")
            PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))
          else
            TOTAL_TESTS="0"
            FAILED_TESTS="0"
            PASSED_TESTS="0"
          fi

          # Check integration test results
          if [ -f integration-results.txt ]; then
            INT_SUCCESS=$(grep -c "PASS:" integration-results.txt || echo "0")
            INT_FAIL=$(grep -c "FAIL:" integration-results.txt || echo "0")
          else
            INT_SUCCESS="0"
            INT_FAIL="0"
          fi

          # Check e2e test results
          if [ -f e2e-results.txt ]; then
            E2E_SUCCESS=$(grep -c "PASS:" e2e-results.txt || echo "0")
            E2E_FAIL=$(grep -c "FAIL:" e2e-results.txt || echo "0")
          else
            E2E_SUCCESS="0"
            E2E_FAIL="0"
          fi

          # Create results summary
          cat > test-summary.json <<EOF
          {
            "unit": {
              "total": $TOTAL_TESTS,
              "passed": $PASSED_TESTS,
              "failed": $FAILED_TESTS
            },
            "integration": {
              "passed": $INT_SUCCESS,
              "failed": $INT_FAIL
            },
            "e2e": {
              "passed": $E2E_SUCCESS,
              "failed": $E2E_FAIL
            }
          }
          EOF

          echo "results=$(cat test-summary.json | jq -c .)" >> $GITHUB_OUTPUT

      # Upload artifacts for later analysis
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.pull_request.number }}
          path: |
            tests.xml
            coverage-pr.out
            coverage-base.out
            coverage-report.html
            coverage-details.txt
            gosec-report.json
            govulncheck-report.json
            lint-report.json
            test-summary.json
            integration-results.txt
            e2e-results.txt
          retention-days: 30

  # Generate and post PR comment
  post-results:
    name: Post PR Results
    runs-on: ubuntu-latest
    needs: [security-check, test-and-analyze]
    if: always()
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.event.pull_request.number }}

      - name: Generate PR comment
        id: comment
        run: |
          # Start building the comment
          cat > pr-comment.md <<'EOF'
          ## 🧪 PR Testing Results

          ### 📊 Test Summary

          EOF

          # Add test results
          if [ -f test-summary.json ]; then
            UNIT_TOTAL=$(jq -r '.unit.total' test-summary.json)
            UNIT_PASSED=$(jq -r '.unit.passed' test-summary.json)
            UNIT_FAILED=$(jq -r '.unit.failed' test-summary.json)
            INT_PASSED=$(jq -r '.integration.passed' test-summary.json)
            INT_FAILED=$(jq -r '.integration.failed' test-summary.json)
            E2E_PASSED=$(jq -r '.e2e.passed' test-summary.json)
            E2E_FAILED=$(jq -r '.e2e.failed' test-summary.json)

            # Determine status emojis
            UNIT_STATUS="✅"
            INT_STATUS="✅"
            E2E_STATUS="✅"

            [ "$UNIT_FAILED" != "0" ] && UNIT_STATUS="❌"
            [ "$INT_FAILED" != "0" ] && INT_STATUS="❌"
            [ "$E2E_FAILED" != "0" ] && E2E_STATUS="❌"

            cat >> pr-comment.md <<EOF
          | Test Type | Status | Passed | Failed | Total |
          |-----------|---------|---------|---------|-------|
          | Unit Tests | $UNIT_STATUS | $UNIT_PASSED | $UNIT_FAILED | $UNIT_TOTAL |
          | Integration | $INT_STATUS | $INT_PASSED | $INT_FAILED | $((INT_PASSED + INT_FAILED)) |
          | E2E Tests | $E2E_STATUS | $E2E_PASSED | $E2E_FAILED | $((E2E_PASSED + E2E_FAILED)) |

          EOF
          fi

          # Add coverage information
          cat >> pr-comment.md <<EOF
          ### 📈 Coverage Analysis

          | Metric | Value |
          |---------|--------|
          | Current Coverage | ${{ needs.test-and-analyze.outputs.coverage-current }}% |
          | Base Coverage | ${{ needs.test-and-analyze.outputs.coverage-base }}% |
          | Coverage Diff | ${{ needs.test-and-analyze.outputs.coverage-diff }}% |

          EOF

          # Coverage status
          COVERAGE_DIFF="${{ needs.test-and-analyze.outputs.coverage-diff }}"
          if (( $(echo "$COVERAGE_DIFF > 0" | bc -l) )); then
            echo "📈 **Coverage increased by ${COVERAGE_DIFF}%** ✅" >> pr-comment.md
          elif (( $(echo "$COVERAGE_DIFF < -1" | bc -l) )); then
            echo "📉 **Coverage decreased by ${COVERAGE_DIFF}%** ⚠️" >> pr-comment.md
          else
            echo "📊 **Coverage remained stable** ✅" >> pr-comment.md
          fi

          echo "" >> pr-comment.md

          # Add security analysis
          cat >> pr-comment.md <<EOF
          ### 🔒 Security Analysis

          | Tool | Issues Found |
          |------|-------------|
          | Gosec (Static Analysis) | ${{ needs.test-and-analyze.outputs.security-issues }} |
          | Govulncheck (Vulnerabilities) | 0 |
          | Linting Issues | ${{ needs.test-and-analyze.outputs.lint-issues }} |

          EOF

          # Security status
          SECURITY_ISSUES="${{ needs.test-and-analyze.outputs.security-issues }}"
          LINT_ISSUES="${{ needs.test-and-analyze.outputs.lint-issues }}"

          if [ "$SECURITY_ISSUES" = "0" ] && [ "$LINT_ISSUES" = "0" ]; then
            echo "🛡️ **No security issues detected** ✅" >> pr-comment.md
          else
            echo "⚠️ **Security or code quality issues detected** - please review" >> pr-comment.md
          fi

          echo "" >> pr-comment.md

          # Add repository security status
          if [ "${{ needs.security-check.outputs.is-fork }}" = "true" ]; then
            cat >> pr-comment.md <<EOF
          ### 🔐 Security Notice

          ⚠️ **This PR is from a fork** - Some security scans and sensitive operations are restricted for security reasons.

          EOF
          fi

          # Add footer
          cat >> pr-comment.md <<EOF
          ---

          🤖 *Automated testing report generated by GitHub Actions*

          📋 **Quick Links:**
          - [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Test Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ github.job }})

          EOF

          # Set output for posting
          {
            echo 'COMMENT<<EOF'
            cat pr-comment.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.comment.outputs.COMMENT }}`;

            // Find existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'User' &&
              comment.body.includes('🧪 PR Testing Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }