name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened, ready_for_review ]

env:
  GO_VERSION: '1.24'

jobs:
  # Build stage
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: '${{ runner.os }}-go-${{ hashFiles(''**/go.sum'') }}'
          restore-keys: |
            '${{ runner.os }}-go-'

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          go build -ldflags "-X main.version=ci-build" -o bin/mcp-shell ./cmd/mcp-shell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'binary-${{ github.sha }}'
          path: bin/mcp-shell
          retention-days: 1

  # Test stage
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: '${{ runner.os }}-go-${{ hashFiles(''**/go.sum'') }}'
          restore-keys: |
            '${{ runner.os }}-go-'

      - name: Download dependencies
        run: go mod download

      - name: Install gotestsum for test reporting
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run unit tests
        run: |
          gotestsum --junitfile=tests.xml --format=testname -- -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        run: |
          go test -v -tags=integration ./...

      - name: Run e2e tests
        run: |
          go test -v -tags=e2e ./...

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Go Test Results
          path: tests.xml
          reporter: java-junit
          fail-on-error: false

      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          git-token: ""
          badge-file-name: coverage.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/dev' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && github.repository == 'rafa-dot-el/mcp-shell'
        run: |
          if [ -f coverage.svg ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"

            # Add coverage badge to repository
            git add coverage.svg

            # Only commit if there are changes
            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badge [skip ci]"
              git push
            fi
          fi

  # Lint stage
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --timeout=5m
          verify: false

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted properly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  # Security stage
  # Additional security features enabled at repository level:
  # - GitHub Secret Scanning for credential detection
  # - Dependabot for automated dependency updates (.github/dependabot.yml)
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install and run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -fmt sarif -out gosec.sarif -severity medium ./...

      - name: Run govulncheck (fails on vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # govulncheck exits 0 even with vulns; use -show to include all
          # and check for "Vulnerability" in output to fail the build
          OUTPUT=$(govulncheck ./... 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Vulnerability"; then
            echo "::error::Vulnerabilities found! Please address them."
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  
  # Documentation stage
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install Node.js dependencies
        run: |
          cd docs
          npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build documentation
        run: |
          cd docs
          hugo --minify --baseURL "https://rafa-dot-el.github.io/mcp-shell/"

      - name: Test documentation
        run: |
          cd docs
          echo "Documentation built successfully"
          ls -la public/

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'docs-${{ github.sha }}'
          path: docs/public/
          retention-days: 1
  

  # Multi-platform build validation
  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: 'Build for ${{ matrix.goos }}/${{ matrix.goarch }}'
        env:
          GOOS: '${{ matrix.goos }}'
          GOARCH: '${{ matrix.goarch }}'
        run: |
          go build -ldflags "-X main.version=ci-build" -o bin/mcp-shell-'${{ matrix.goos }}'-'${{ matrix.goarch }}' ./cmd/mcp-shell

  # Release stage (only on tags)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test, lint, security, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      - name: Generate build attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/**/*'