name: Container Build

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Dockerfile'
      - '.github/workflows/container.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: rafadotel/mcp-shell

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write
  attestations: write

jobs:
  # Security check - prevent token exposure from forks
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.check.outputs.is-fork }}
      can-push: ${{ steps.check.outputs.can-push }}
    steps:
      - name: Check repository ownership
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "is-fork=true" >> $GITHUB_OUTPUT
              echo "can-push=false" >> $GITHUB_OUTPUT
              echo "::warning::Fork detected - Docker builds and sensitive operations will be skipped for security"
            else
              echo "is-fork=false" >> $GITHUB_OUTPUT
              echo "can-push=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "is-fork=false" >> $GITHUB_OUTPUT
            echo "can-push=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: security-check
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: needs.security-check.outputs.can-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.security-check.outputs.can-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=match,pattern=v(.+),group=1
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.title=MCP Shell
            org.opencontainers.image.description=MCP Shell Server for serving shell AI models
            org.opencontainers.image.vendor=Rafael
            org.opencontainers.image.licenses=GPL-3.0

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=match,pattern=v(.+),group=1
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.title=MCP Shell
            org.opencontainers.image.description=MCP Shell Server for serving shell AI models
            org.opencontainers.image.vendor=Rafael
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push to both registries
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ needs.security-check.outputs.can-push == 'true' }}
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate container attestations
        if: needs.security-check.outputs.can-push == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Run container security scan
        if: needs.security-check.outputs.can-push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_IMAGE }}:latest
          format: 'sarif'
          output: 'container-results.sarif'

      - name: Upload container scan results
        if: needs.security-check.outputs.can-push == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'container-results.sarif'
          category: 'container'

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'rafa-dot-el/mcp-shell'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.md