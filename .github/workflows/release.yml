name: Release

on:
  # Trigger release when PR is merged to main
  pull_request:
    branches: [ main ]
    types: [ closed ]
  # Manual release trigger
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip test validation'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.23'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Only run if PR was merged (not just closed)
  check_merge:
    name: Check PR Merge
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)) && github.repository == 'rafa-dot-el/mcp-shell'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version_type: ${{ steps.check.outputs.version_type }}
    steps:
      - name: Determine release parameters
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version_type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            # Auto-determine version type from PR labels or branch name
            PR_BRANCH="${{ github.event.pull_request.head.ref }}"
            if [[ "$PR_BRANCH" == feature/* ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_type=minor" >> $GITHUB_OUTPUT
            elif [[ "$PR_BRANCH" == fix/* ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_type=patch" >> $GITHUB_OUTPUT
            elif [[ "$PR_BRANCH" == chore/* ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_type=patch" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "version_type=patch" >> $GITHUB_OUTPUT
            fi
          fi

  # Pre-release validation
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    needs: check_merge
    if: needs.check_merge.outputs.should_release == 'true' && github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: '${{ runner.os }}-go-${{ hashFiles(''**/go.sum'') }}'
          restore-keys: |
            '${{ runner.os }}-go-'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linting
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

      - name: Run security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec ./...

  # Create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check_merge, validate]
    if: always() && needs.check_merge.outputs.should_release == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine next version
        id: version
        run: |
          # Get current version from VERSION file or latest tag
          if [ -f VERSION ]; then
            CURRENT_VERSION=$(cat VERSION)
          else
            CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          fi

          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump version based on type
          case "${{ needs.check_merge.outputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > VERSION

          # Set outputs
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/**/*'