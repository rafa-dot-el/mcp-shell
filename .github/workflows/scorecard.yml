name: OSSF Scorecard

on:
  # Run on branch protection rule changes
  branch_protection_rule:
  # Run on scheduled basis
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 4 AM UTC
  # Allow manual runs
  workflow_dispatch:
  # Run on pushes to main (but not too frequently)
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed for Code scanning upload
      security-events: write
      # Needed to collect OSSF Scorecard score
      id-token: write
      # Needed to access repository details
      contents: read
      # Needed to read workflow files
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Optionally upload to code-scanning dashboard
          publish_results: true

      - name: Upload SARIF results to dependency graph
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: 'OSSF-Scorecard'