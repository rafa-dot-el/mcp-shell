version: 1

project_name: mcp-shell

before:
  hooks:
    # Clean up before building
    - go mod tidy
    - go generate ./...

builds:
  - id: mcp-shell
    main: ./cmd/mcp-shell
    binary: mcp-shell
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X main.builtBy=goreleaser

archives:
  - id: mcp-shell
    builds: [mcp-shell]
    name_template: >-
      mcp-shell_{{- .Version -}}_{{- .Os -}}_{{- .Arch -}}{{- if .Arm -}}v{{- .Arm -}}{{- end -}}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - merge conflict
      - Merge pull request

release:
  github:
    owner: rafa-dot-el
    name: mcp-shell
  name_template: "{{.ProjectName}} v{{.Version}}"
  prerelease: auto




# Docker images are built and published by separate container workflow
# dockers:
#   - image_templates:
#       - "rafa-dot-el/mcp-shell:latest"

announce:
  skip: true