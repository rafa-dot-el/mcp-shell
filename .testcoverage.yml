# Test coverage configuration for go-test-coverage
# See: https://github.com/vladopajic/go-test-coverage

# Profile path (will be generated by go test)
profile: coverage.out

# Local mode - for local testing and CI/CD
local: true

# Coverage thresholds
threshold:
  # Global minimum coverage percentage
  total: 80
  # Package minimum coverage percentage
  package: 75
  # File minimum coverage percentage
  file: 70

# Override thresholds for specific packages/files
override:
  # Allow lower coverage for main packages (they're usually just entry points)
  "github.com/rafa-dot-el/mcp-shell/cmd/mcp-shell": 50
  # Example: individual files can have custom thresholds
  # "github.com/rafa-dot-el/mcp-shell/internal/cmd/root.go": 60

# Exclude packages/files from coverage reporting
exclude:
  # Exclude test files from coverage calculation
  paths:
    - ".*_test.go"
    - ".*test.*"
  # Exclude specific packages
  packages:
    # Add any packages you want to exclude
    # - "github.com/rafa-dot-el/mcp-shell/internal/example"

# Badge configuration
badge:
  # Generate coverage badge
  file-name: coverage.svg